<!DOCTYPE html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Rejestracja — Dominik Studio</title><link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet"></head>
<body class="auth-page"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">D</span><span><strong>DOMINIK</strong><small>STUDIO / EDITING</small></span></a><a class="header-cta" href="index.html">← Strona główna</a></header>
<main class="auth-wrap"><section class="auth-card"><div class="eyebrow"><span></span> NOWE KONTO</div><h1>Załóż<br><em>konto.</em></h1><p class="auth-lead">Jedno konto do zamówień, płatności i późniejszego przesyłania materiałów.</p>
<form id="registerForm" class="auth-form"><label>IMIĘ / NAZWA<input name="name" type="text" autocomplete="name" required placeholder="Jak mam się do Ciebie zwracać?"></label><label>E-MAIL<input name="email" type="email" autocomplete="email" required placeholder="twoj@email.pl"></label><label>HASŁO<input name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Minimum 8 znaków"></label><div id="status" class="auth-status"></div><button class="btn btn-primary" type="submit">Utwórz konto <span>→</span></button></form>
<p class="auth-switch">Masz już konto? <a id="loginLink" href="login.html">Zaloguj się</a></p></section></main>
<script>
const next=new URLSearchParams(location.search).get('next');if(next)document.getElementById('loginLink').href='login.html?next='+encodeURIComponent(next);
document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,s=document.getElementById('status'),b=f.querySelector('button');b.disabled=true;s.textContent='Tworzenie konta...';try{const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name.value,email:f.email.value,password:f.password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error);location.href=next||d.redirect||'dashboard.html'}catch(err){s.textContent=err.message;b.disabled=false}});
</script></body></html>
