<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Moje konto — Dominik Studio</title><link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet"></head>
<body class="dashboard-page"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">D</span><span><strong>DOMINIK</strong><small>STUDIO / EDITING</small></span></a><div class="account-nav"><a href="index.html">Strona główna</a><button id="logout">Wyloguj</button></div></header>
<main class="dashboard-wrap"><div class="dash-head"><div><div class="eyebrow"><span></span> MOJE KONTO</div><h1>Witaj, <em id="userName">...</em></h1><p>Z tego miejsca będziesz zarządzać swoimi zamówieniami.</p></div><a class="btn btn-primary" href="payment.html">Nowe zamówienie <span>→</span></a></div>
<section><div class="section-title"><h2>Twoje <em>zamówienia.</em></h2><span id="count"></span></div><div id="orders" class="orders"><div class="empty-state">Ładowanie...</div></div></section></main>
<script>
const labels={pending:['OCZEKUJE','Zamówienie utworzone, oczekuje na płatność.'],paid:['OPŁACONE','Płatność potwierdzona.'],in_progress:['W REALIZACJI','Montaż jest w trakcie realizacji.'],revision:['DO POPRAWKI','Czekamy na informacje dotyczące poprawek.'],completed:['GOTOWE','Zamówienie zostało zakończone.'],cancelled:['ANULOWANE','Zamówienie zostało anulowane.']};
async function load(){const me=await fetch('/api/me').then(r=>r.json());if(!me.user){location.href='login.html?next='+encodeURIComponent('dashboard.html');return}document.getElementById('userName').textContent=me.user.name;const r=await fetch('/api/orders');const d=await r.json();if(!r.ok){document.getElementById('orders').innerHTML='<div class="empty-state">'+d.error+'</div>';return}document.getElementById('count').textContent=d.orders.length+' '+(d.orders.length===1?'zamówienie':'zamówień');if(!d.orders.length){document.getElementById('orders').innerHTML='<div class="empty-state"><strong>Nie masz jeszcze zamówień.</strong><br>Wybierz usługę i zacznij pierwszą realizację.</div>';return}document.getElementById('orders').innerHTML=d.orders.map(o=>{const s=labels[o.status]||[o.status,''];return `<article class="order-card"><div><small>ZAMÓWIENIE #${o.id}</small><h3>${o.service_name}</h3><p>${o.notes?escapeHtml(o.notes):'Brak dodatkowych informacji.'}</p></div><div class="order-side"><strong>${Number(o.price).toFixed(2).replace('.',',')} zł</strong><span class="status-pill ${o.status}">${s[0]}</span><small>${new Date(o.created_at).toLocaleDateString('pl-PL')}</small></div></article>`}).join('')}
function escapeHtml(v){return v.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}load();document.getElementById('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='index.html'};
</script></body></html>
